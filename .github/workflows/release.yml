name: Publish Nidavellir releases

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'CHANGELOG.md'
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release_info.outputs.publish }}
      tag: ${{ steps.release_info.outputs.tag }}
      version: ${{ steps.release_info.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests before tagging
        run: npm test
      - name: Verify version and select release
        id: release_info
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match package version $version"
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            git fetch --tags origin
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "Version $tag already has a tag; no duplicate release will be published."
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag "$tag"
              git push origin "$tag"
              echo "Created release tag $tag"
              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  build-windows:
    if: needs.verify.outputs.publish == 'true'
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer without publishing a separate release
        run: npx electron-builder --win nsis --publish never
      - name: Save Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: Nidavellir-Windows-${{ needs.verify.outputs.version }}
          path: |
            dist/*.exe
            dist/*.exe.blockmap
          if-no-files-found: error
          retention-days: 1

  build-linux:
    if: needs.verify.outputs.publish == 'true'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Linux AppImage without publishing a separate release
        run: npx electron-builder --linux AppImage --publish never
      - name: Save Linux release files
        uses: actions/upload-artifact@v4
        with:
          name: Nidavellir-Linux-${{ needs.verify.outputs.version }}
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 1

  publish-release:
    if: needs.verify.outputs.publish == 'true'
    needs: [verify, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: Nidavellir-Windows-${{ needs.verify.outputs.version }}
          path: artifacts/windows
      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: Nidavellir-Linux-${{ needs.verify.outputs.version }}
          path: artifacts/linux
      - name: Assemble installers and generate verified update metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.verify.outputs.version }}"
          mkdir -p release-assets
          cp artifacts/windows/* release-assets/
          cp artifacts/linux/* release-assets/
          node scripts/generate-update-manifest.js windows "$version" "release-assets/Nidavellir-Setup-$version.exe" "release-assets/latest.yml"
          node scripts/generate-update-manifest.js linux "$version" "release-assets/Nidavellir-$version.AppImage" "release-assets/latest-linux.yml"
          test -s "release-assets/Nidavellir-Setup-$version.exe"
          test -s "release-assets/Nidavellir-$version.AppImage"
          test -s release-assets/latest.yml
          test -s release-assets/latest-linux.yml
      - name: Create one GitHub Release with all installers and update manifests
        run: gh release create "${{ needs.verify.outputs.tag }}" release-assets/* --verify-tag --title "Nidavellir ${{ needs.verify.outputs.version }}" --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
